interpretation:
  - Four independent held-out successes prove that the frozen Diffusion checkpoint can produce successful PushT trajectories.
  - The exact 95 percent success interval is approximately 1.10 to 9.93 percent; reliability remains low.
  - Diffusion improves dense reward and peak proximity consistently versus both ACT baselines, but does not improve sparse success versus deterministic ACT.
  - Only the first ten episodes were rendered and none is a success, so a separate deterministic replay of a successful seed is needed for a demo asset.
  - The development 0/5 gate remains failed and cannot be retroactively changed by held-out results.

boundary: >-
  This is one training run and one fixed held-out seed set, not independent training replicates. No new
  training, tuning, upload, commit, or push is authorized by this result.

