expected_exceptions:
  - TorchCodec ABI loader failed during import and fell back to the explicitly configured PyAV backend.
  - The raw log contains carriage-return progress frames, so byte size is much larger than newline count.

interpretation:
  - The fixed full split completed all 30000 BF16 optimizer steps and all planned offline evaluations and checkpoints.
  - Train L1 and pre-clip gradient norm decreased while remaining finite; no execution or numerical stop criterion fired.
  - Offline validation reached its minimum at 25000 and rose slightly by 30000, so checkpoint quality is not assumed monotonic.
  - Closed-loop reward and success remain unknown; training PASS is not a successful-policy claim.
  - The 30k checkpoint reload and two-episode fixed-data accuracy audit passed, but its comparison to the 100k VAE checkpoint is mixed rather than uniformly better.
  - The 10k and 20k closed-loop evaluations achieved zero successes, while the 30k checkpoint achieved one strict success in five fixed seeds and passed the pre-registered initial-success gate.
  - The 1/5 result establishes an initial successful demo, not a statistically stable benchmark success rate; expanded evaluation requires a separate decision.
  - The authorized independent 100-seed evaluation achieved 6/100 successes with an exact 95 percent binomial interval of approximately 2.23 to 12.60 percent.
  - The paired VAE 25k comparison achieved 2/100 successes; deterministic ACT has a higher point estimate and consistently higher max reward, but the paired success-rate difference is not statistically stable.
