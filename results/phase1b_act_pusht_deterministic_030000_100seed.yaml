interpretation:
  - Six successes on 100 unseen seeds confirm that the five-seed success was not an isolated unique environment state.
  - The independent point estimate is 6 percent, substantially below the development-set 20 percent, demonstrating development-seed selection optimism.
  - The exact 95 percent binomial interval is approximately 2.23 to 12.60 percent, so the policy has measurable but low and uncertain reliability.
  - Thirteen episodes reached max reward at least 0.95 but only six registered success, leaving a substantial terminal refinement or success-retention gap.
  - The completed VAE 25k run on identical seeds is recorded in the paired comparison result.
  - This rollout does not change or remeasure training loss, offline evaluation loss, gradient norm, training throughput, or training GPU allocation.
  - The completed paired VAE comparison yields 6 versus 2 successes, but the paired success difference is not statistically stable; deterministic max reward improves more consistently.

