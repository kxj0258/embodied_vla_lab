conclusion:
  - Deterministic ACT has a higher held-out success point estimate: 6 percent versus 2 percent, an absolute increase of 4 percentage points and a relative ratio of 3.
  - The success improvement is not statistically stable at this sample size: exact paired McNemar p is 0.289 and the paired bootstrap interval for the difference includes zero.
  - Deterministic ACT improves peak target proximity more consistently: the paired max-reward difference is positive and its pre-registered bootstrap interval excludes zero.
  - Sum reward is 7.47 percent higher on average, but its paired interval crosses zero and does not establish a stable improvement.
  - Deterministic ACT has fewer catastrophic zero-reward episodes, 7 versus 22, and twice as many episodes reaching max reward at least 0.90, 24 versus 12.
  - The models have disjoint successful seed sets, indicating complementary state coverage rather than deterministic ACT strictly dominating every VAE success mode.
  - Because training budgets differ by 5000 steps and success evidence remains sparse, the result supports but does not conclusively prove the use_vae=false causal hypothesis.
  - Both absolute success rates remain too low for a robust policy claim; terminal refinement, recovery behavior, and data coverage remain the primary improvement targets.

boundary: >-
