    counts also differ; closed-loop paired evaluation is required for task-quality comparison.

interpretation:
  - Training execution and numerical/resource gates passed with all planned optimizer steps, evaluations, and checkpoints.
  - Training loss and gradient norm decreased strongly while remaining finite.
  - Live-weight offline validation was best at 10k and degraded substantially after 15k, indicating overfitting or calibration drift.
  - EMA deployment quality is not measured by the recorded offline eval loss, so checkpoint selection remains pending.
  - No environment rollout was performed; this result does not establish reward, success, or a better demo.
  - Subsequent preregistered development rollouts gave 0/5 successes for each of the 10k, 20k, and 30k EMA checkpoints.
  - The 30k EMA checkpoint is frozen for any held-out comparison because it wins the preregistered max-reward tie-break, despite the failed development success gate.
  - The frozen 30k EMA achieved 4/100 successes on the independent held-out seeds, proving demo capability but not higher reliability than deterministic ACT at 6/100.
  - A 31-episode sequential rerun produced two additional strict-success videos, so the demo asset objective passed; individual trajectory replay was not bitwise stable.

