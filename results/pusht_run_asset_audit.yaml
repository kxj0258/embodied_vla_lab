generated_artifact_boundary:
  tracked:
    - configs
    - checkers_and_run_profiles
    - structured_results
    - checkpoint_and_video_hashes
    - narrative_readmes_and_handoffs
  ignored_but_preserved_on_current_host:
    - dataset_cache
    - checkpoints
    - eval_info_json
    - raw_logs
    - videos
  reason: Generated artifacts are large; the Diffusion checkpoint tree alone is approximately 15 GB.

reproduction_limits:
  - A fresh clone still requires the staged evla-core installation and pinned local dataset snapshot.
  - diffusers 0.39.0 is a separately authorized pip-layer dependency.
  - Recomputed model weights may differ across CUDA/software stacks even with the same nominal seed.
  - Diffusion closed-loop trajectories were not bitwise stable across separate processes.

boundary: >-
  This audit created inert scripts and documentation only. It did not run training, evaluation, download,
  upload, GUI, commit, or push.
