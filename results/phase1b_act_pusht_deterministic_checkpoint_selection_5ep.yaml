current_interpretation:
  - The 10000-step checkpoint completed all five controlled rollouts and produced intact local videos, so rollout execution passed.
  - All five successes are false, so the checkpoint-level task success gate fails.
  - Seed 20260826 is the closest trajectory, but its maximum reward 0.93315 corresponds to about 88.65 percent coverage, below the strict greater-than-95-percent success threshold.
  - The 20000-step checkpoint also completed all five rollouts but achieved zero successes, and both aggregate reward metrics regressed relative to step 10000.
  - The 30000-step checkpoint completed all five rollouts and achieved one strict environment success on seed 20260825, so the pre-registered Route B initial-success gate passes.
  - Closed-loop quality is non-monotonic: step 20000 regressed from step 10000, then step 30000 improved strongly and is best on both aggregate metrics.
  - Offline validation loss was lowest at step 25000, for which no checkpoint was saved; the successful step 30000 eval loss was slightly worse, again limiting offline-loss checkpoint selection.
  - One success in five fixed diagnostic seeds establishes an initial successful demo, not a stable 20-percent benchmark success rate or generalization claim.
  - Loss and gradient metrics are training-only measurements and are unchanged by this rollout; this eval output reports no peak GPU allocation.

