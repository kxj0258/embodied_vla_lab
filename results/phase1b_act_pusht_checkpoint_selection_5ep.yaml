visual_diagnosis:
  - The 25000-step seed-20260826 rollout reached a high-overlap pose and then pushed the block away again before episode end.
  - The 25000-step seeds 20260828 and 20260829 reached near-target poses but stalled with residual translation or rotation error.
  - The 75000-step seed-20260825 rollout also reached a near-target pose transiently and then degraded.

conclusion:
  - Closed-loop quality is non-monotonic across training checkpoints despite the 100000-step checkpoint having the lowest recorded offline validation loss.
  - Step 25000 is the best checkpoint by both aggregate reward metrics, beating step 100000 by 6.27 percent in average sum reward and 21.75 percent in average max reward.
  - The 50000-step collapse followed by recovery at 75000 and 100000 does not support a simple monotonic-overfitting explanation.
  - Checkpoint selection and offline-to-online objective mismatch are material factors, but they are not sufficient explanations for failure because every checkpoint achieved zero successes.
  - Across the four checkpoints and five shared seeds, the recurring failure mode is insufficient terminal pose correction or failure to retain a near-success state.
  - The 20 rollouts reuse five seeds across checkpoints and therefore are controlled paired diagnostics, not 20 independent samples for a benchmark confidence interval.

