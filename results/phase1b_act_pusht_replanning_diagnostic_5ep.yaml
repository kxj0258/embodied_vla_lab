per_seed_interpretation:
  - Exec-5 improved max reward for seeds 20260825 and 20260826 but degraded seeds 20260827 through 20260829.
  - Exec-1 was never the best setting for any seed and often produced little sustained pushing.
  - Exec-10 produced the best aggregate metrics and the strongest single near-miss at seed 20260828.
  - Temporal ensembling improved average peak reward over raw exec-1 but reduced cumulative reward and remained far below exec-10.
  - Temporal ensembling degraded the prior seed-20260828 near-miss from 0.998760 to 0.341267 maximum reward.

conclusion:
  - The hypothesis that a one-second open-loop interval is the primary cause of failure is not supported by this controlled diagnostic.
  - The learned action chunk appears to rely on later actions for coherent sustained contact; repeatedly resampling the first action can disrupt that trajectory.
  - Original-ACT temporal ensembling at coefficient 0.01 does not recover successful or sustained control for this checkpoint.
  - The remaining bottlenecks are more consistent with limited recovery and fine-pose-correction coverage, single-frame partial observability, and behavior-cloning distribution shift.
  - All four settings achieved zero successes, so no tested execution or smoothing method establishes a successful PushT policy.
  - Five seeds are sufficient for this bounded diagnosis but not for a stable benchmark estimate.

