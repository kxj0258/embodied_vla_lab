  episode_length: 300
  fps: 10
  observation_size: [96, 96]
  chunk_size: 50
  n_action_steps: 10
  batch_size: 1
  use_async_envs: false
  recording_dataset: false
  strict_offline: true
  rendered_video_limit_per_model: 10

