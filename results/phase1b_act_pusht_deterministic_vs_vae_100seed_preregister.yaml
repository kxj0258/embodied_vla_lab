preregistration_correction:
  classification: EXPECTED_DOCUMENTATION_CORRECTION
  detail: The original inclusive end seed was miscomputed as 20260928; 100 consecutive integers starting at 20260830 end at 20260929. The executed deterministic set and frozen paired VAE set are both 20260830 through 20260929.

primary_analysis:
  - success_count and success_rate for each model
  - 95_percent_binomial_confidence_interval for each success rate
  - paired per-seed success contingency table
  - paired success-rate difference
  - exact McNemar test on discordant seed outcomes

secondary_analysis:
  - average and median sum reward
  - average and median max reward
  - paired per-seed reward differences with a paired bootstrap confidence interval
  - failure and near-miss seed inventory
  - evaluation wall time and episodes per second

interpretation_rules:
  - The independent 100-seed result supersedes the five development seeds for performance estimation.
  - A higher point estimate alone is not called a stable improvement without paired uncertainty reporting.
  - The comparison is paired and independent in environment seeds, but checkpoint training budgets differ by 5000 steps, so it is not a perfectly matched use_vae-only causal estimate.
  - No checkpoint reselection, inference change, seed substitution, or early stopping is allowed after either run starts.
  - No new training or additional model change follows automatically from these evaluations.

expected_runtime:
  pure_eval_per_model: approximately 4.0-4.5 minutes based on the five-seed measurements
  total_for_two_models: approximately 9-12 minutes including initialization and local video writes

artifacts:
  deterministic_output: outputs/eval/phase1b_act_pusht_deterministic_030000_100seed_exec10
  deterministic_log: results/raw/phase1b_act_pusht_deterministic_030000_100seed_exec10.log
  vae_output: outputs/eval/phase1b_act_pusht_vae_025000_100seed_exec10
  vae_log: results/raw/phase1b_act_pusht_vae_025000_100seed_exec10.log

boundary: >-
  This file freezes an authorized evaluation protocol. It does not execute evaluation, train a
  model, access the network, upload artifacts, create a commit, or authorize follow-up changes.
