dataset:
  source_repo: yifengzhu-hf/LIBERO-datasets
  revision: f13aa24a3da8c43c7225569f28c562979fa0e35a
  path: libero/libero/datasets/libero_goal/turn_on_the_stove_demo.hdf5
  sha256: 387fc10747696b80dea6ed8d7f2beaa162bf92ae11750b241073cbd33aac73d5
  language_instruction: turn on the stove

split:
  algorithm: numpy_default_rng_shuffle_then_sort
  seed: 20260826
  train_episodes: [1, 2, 3, 4, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 18, 19, 20, 22, 23, 24, 25, 26, 27, 28, 30, 31, 32, 33, 35, 36, 37, 38, 39, 41, 44, 46, 47, 48, 49]
  validation_episodes: [0, 5, 12, 21, 29, 34, 40, 42, 43, 45]

features:
  observation.images.agentview: {source: obs/agentview_rgb, shape: [3, 128, 128], dtype: float32, transform: uint8_hwc_to_float_chw_0_1}
  observation.images.eye_in_hand: {source: obs/eye_in_hand_rgb, shape: [3, 128, 128], dtype: float32, transform: uint8_hwc_to_float_chw_0_1}
  observation.state:
    shape: [9]
    dtype: float32
    concatenation_order: [obs/joint_states, obs/gripper_states]
  action: {source: actions, shape: [7], dtype: float32}

temporal:
  observation_steps: 1
  action_chunk_size: 20
  planned_execution_steps: 5
  terminal_padding: zeros_masked_by_action_is_pad
  action_is_pad_shape: [20]

normalization:
  images: scale_uint8_to_0_1
  state: mean_std_from_train_episodes_only
  action: mean_std_from_train_episodes_only

